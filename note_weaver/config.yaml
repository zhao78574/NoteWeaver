# NoteWeaver 配置文件
# 所有路径、模型参数、策略配置均在此集中管理

# ==========================================
# 模型注册表（Provider 抽象层）
# ==========================================
model_registry:
  llm:
    provider: deepseek
    model: deepseek-v4-flash
    base_url: "https://api.deepseek.com"
  vision:
    provider: qwen-vl
    model: qwen-vl-plus
    base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  transcriber:
    provider: faster-whisper
    model_size: small

# ==========================================
# API 配置
# ==========================================
api:
  deepseek:
    api_key: ""
    base_url: "https://api.deepseek.com"
    model_fast: "deepseek-v4-flash"
    model_pro: "deepseek-v4-flash"
    model_embed: "deepseek-embedding"
  qwen:
    api_key: ""
    base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    model_vision: "qwen-vl-plus"
  openai:
    api_key: ""
    base_url: "https://api.openai.com/v1"
  anthropic:
    api_key: ""

proxy:
  enabled: true
  host: "127.0.0.1"
  port: 7890

whisper:
  model_size: "medium"
  device: "auto"
  compute_type: "auto"
  language: "zh"

router:
  enabled: true
  cache_enabled: true
  cache_ttl_days: 7
  visual_density_check: true

corrector:
  enabled: true
  batch_size: 20
  model: "fast"

policy:
  visual_density:
    low:
      frame_interval: 120
      max_images: 10
    medium:
      frame_interval: 60
      max_images: 25
    high:
      frame_interval: 15
      max_images: 60

screenshot:
  default_interval: 180
  min_interval: 30
  max_interval: 300

qa:
  pass_threshold: 7.0
  fallback_thresholds: [7.0, 6.5, 6.0]
  max_retries: 2
  dimension_weights:
    terminology_accuracy: 0.20
    structure_clarity: 0.15
    image_text_alignment: 0.15
    completeness: 0.15
    hallucination: 0.15
    readability: 0.10
    style_consistency: 0.10

paths:
  base_dir: ""
  source_video_dir: "Video"
  txt_dir: "data/TXT"
  note_dir: "data/Note"
  memory_dir: "data/memory_db"
  log_dir: "logs"

vision:
  max_images_per_batch: 20
  skip_low_quality: true
  quality_threshold: "medium"

merge:
  enabled: true
  max_merge_total_duration: 1800
  batch_size: 5

classification_strategies:
  lecture_ppt:
    screenshot_interval: 60
    note_style: "detailed"
    composer_template: "lecture_with_slides"
  lecture_whiteboard:
    screenshot_interval: 90
    note_style: "detailed"
    composer_template: "lecture_whiteboard"
  demo:
    screenshot_interval: 30
    note_style: "step_by_step"
    composer_template: "demo_procedure"
  meeting:
    screenshot_interval: 180
    note_style: "outline"
    composer_template: "meeting_minutes"
  default:
    screenshot_interval: 180
    note_style: "detailed"
    composer_template: "default"
